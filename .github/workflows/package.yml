name: Package Container

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mai-ru-software-house/dating-match-engine

jobs:
  test:
    name: Run Tests and Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: |
          pytest -v

  # Feature branches only run the tests. Pull requests build the image without pushing it,
  # main pushes the commit and `dev` tags, and a vX.Y.Z git tag pushes the release image.
  build-and-push:
    name: Build and Push Package
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image version comes from the git tag, so it must match the version in pyproject.toml
      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.0.0, got $GITHUB_REF_NAME"
            exit 1
          fi
          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version"
            exit 1
          fi

      # Every pushed image gets an immutable tag with the commit hash. Only main moves the
      # `dev` tag, and only a release tag adds the version (v1.0.0 becomes 1.0.0)
      - name: Work out the image tags
        id: tags
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          {
            echo "list<<EOF"
            echo "$image:$GITHUB_SHA"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "$image:dev"
            fi
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$image:${GITHUB_REF_NAME#v}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
